<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Pacikalus: "Pa cik alus?" is Latvian for "How much is the beer?".
       A beer with a price tag, in front of Riga's Powder Tower. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4C93"/><stop offset="1" stop-color="#13234F"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC21A"/><stop offset="0.55" stop-color="#F5A300"/><stop offset="1" stop-color="#D98500"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A78B8"/><stop offset="0.5" stop-color="#4A68AA"/><stop offset="1" stop-color="#34508E"/>
    </linearGradient>
    <clipPath id="badge"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <!-- Powder Tower (Pulvertornis): round stone tower, cone roof, small spire -->
    <g>
      <path d="M150 104 Q150 98 156 97 L222 97 Q228 98 228 104 L232 250 L146 250 Z" fill="url(#tower)"/>
      <path d="M144 100 L189 34 L234 100 Z" fill="#0F1C40"/>
      <path d="M189 34 L189 18" stroke="#0F1C40" stroke-width="3"/>
      <circle cx="189" cy="16" r="3" fill="#F5B800"/>
      <rect x="146" y="96" width="86" height="8" rx="3" fill="#263F7A"/>
      <g fill="#1B2F63">
        <path d="M200 120 a6 6 0 0 1 12 0 v14 h-12 z"/>
        <path d="M200 158 a6 6 0 0 1 12 0 v14 h-12 z"/>
      </g>
      <!-- cannonballs still stuck in the wall -->
      <circle cx="222" cy="206" r="4" fill="#1B2F63"/>
      <circle cx="160" cy="208" r="3.5" fill="#1B2F63"/>
      <g stroke="#3F5C9E" stroke-width="2" opacity="0.7">
        <path d="M148 140 h82"/><path d="M148 182 h82"/>
      </g>
    </g>
    <!-- ground -->
    <rect x="0" y="226" width="256" height="40" fill="#0F1C40" opacity="0.55"/>
  </g>
  <!-- handle -->
  <path d="M150 118 h16 a20 20 0 0 1 20 20 v26 a20 20 0 0 1 -20 20 h-16" fill="none" stroke="#E7ECF7" stroke-width="12"/>
  <!-- glass -->
  <rect x="44" y="100" width="112" height="122" rx="16" fill="#E7ECF7"/>
  <rect x="54" y="112" width="92" height="100" rx="9" fill="url(#beer)"/>
  <rect x="66" y="122" width="10" height="78" rx="5" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="102" cy="176" r="4.5" fill="#FFE59A"/>
  <circle cx="122" cy="152" r="3.5" fill="#FFE59A"/>
  <circle cx="110" cy="134" r="3" fill="#FFE59A"/>
  <circle cx="130" cy="192" r="3" fill="#FFE59A"/>
  <!-- foam -->
  <g fill="#FFFFFF">
    <circle cx="58" cy="102" r="19"/><circle cx="84" cy="90" r="24"/><circle cx="114" cy="92" r="22"/>
    <circle cx="140" cy="102" r="19"/><rect x="44" y="100" width="112" height="18"/>
  </g>
  <path d="M140 120 q8 0 8 12 q0 9 -7 9 q-6 0 -6 -9 z" fill="#FFFFFF"/>
  <!-- price tag: "pa cik?" = how much? -->
  <g transform="rotate(-12 64 46)">
    <path d="M30 28 h52 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-52 a8 8 0 0 1 -8 -8 v-24 a8 8 0 0 1 8 -8 z" fill="#E5383B"/>
    <text x="56" y="58" font-family="DejaVu Sans, Segoe UI, Arial" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">€?</text>
  </g>
</svg>
